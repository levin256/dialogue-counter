name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで新しく push されたら、古い実行は止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 既定は読み取りだけ。必要なジョブでだけ足す
permissions:
  contents: read

jobs:
  check:
    name: lint / typecheck / test / build
    # ubuntu-latest は、GitHub が切り替えると中身が変わる（Playwright が入れる OS のパッケージも変わる）ので、版を固定する。
    # 提供が終わる前に予告が出るので、そのときに上げる
    runs-on: ubuntu-24.04
    steps:
      # アクションは、タグの付け替えで中身を差し替えられないように、コミット SHA で固定する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node は mise.toml、pnpm は package.json の packageManager の版を使う
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # 指定しないと、実行のたびに最新の mise を入れる。手元と同じ版にする。
          # Dependabot は with の中の版を上げないので、mise を上げるときは手で書き換える（e2e のジョブも）
          version: 2026.10.11
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # コンポーネントテストは、本物の Chromium で部品を描く
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      # デプロイのジョブで、確かめたものと同じビルドを使う
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # 落ちたときに、どの画面で落ちたかを見られるようにする
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    name: Deploy (Firebase Hosting)
    needs: [check, e2e]
    # main は本番に、PR はプレビュー用の URL に出す。
    # フォークや Dependabot の PR には Secrets を渡さないので、同じリポジトリのブランチからの PR だけにする
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # PR にプレビューの URL をコメントするため
      pull-requests: write
      checks: write
    env:
      # Secrets を登録するまでは、デプロイを飛ばす（ジョブは成功のまま）
      HAS_FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - if: env.HAS_FIREBASE_SECRET != 'true'
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT が未登録のため、デプロイを飛ばしました"
      - if: env.HAS_FIREBASE_SECRET == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.HAS_FIREBASE_SECRET == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - if: env.HAS_FIREBASE_SECRET == 'true'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: dialogue-counter
          # 指定しないと、公開されたばかりの最新版を使う。鍵を持つジョブで動くので、公開から 7 日たった版に固定する。
          # Dependabot は with の中の版を上げないので、上げるときは手で書き換える
          firebaseToolsVersion: 15.34.1
          # main は本番（live）、PR は PR ごとのプレビュー（7日で消える）
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
          expires: 7d
